name: Build Native v1.0.26.1 OAuth Diagnostic

on:
  push:
    branches:
      - build/v1.0.26.1-oauth-diagnostic
    paths:
      - 'native-v1.0.26/**'
      - '.github/workflows/build-native-v1.0.26-test.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish native Windows EXE
        shell: pwsh
        run: |
          dotnet publish .\native-v1.0.26\KUROAutoArchiveNative.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\out
          if (!(Test-Path '.\out\KURO Auto Archive.exe')) { throw 'Native EXE was not produced.' }
          Get-FileHash '.\out\KURO Auto Archive.exe' -Algorithm SHA256 | Format-List

      - name: Native launch smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\out\KURO Auto Archive.exe' -PassThru
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) {
            throw "Native EXE exited too early. ExitCode=$($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Native EXE launch smoke test OK (process remained alive for 5 seconds).'

      - name: Write test notes
        shell: pwsh
        run: |
          @'
          KURO Auto Archive v1.0.26.1 OAuth Diagnostic TEST

          Purpose:
          - Native C# WinForms test. No PowerShell or CMD is launched.
          - Diagnose Google OAuth token exchange failures.

          Diagnostic change:
          - HTTP API errors now show Google error / error_description instead of only "HTTP 400".
          - The app log records the exception message through the existing failure logger.
          - Authorization code, refresh token, access token, and PKCE code_verifier are NOT printed by this diagnostic change.

          Existing native test features:
          - Read/save %APPDATA%\KURO_TwitchAutoArchive\config.dat with DPAPI CurrentUser
          - Twitch shared public Client ID + Device Code Flow
          - YouTube embedded Desktop Client ID + PKCE(S256) + 127.0.0.1 random loopback port
          - YouTube token storage in DPAPI-protected youtube_token.dat
          - CI launch smoke test: EXE remained running for at least 5 seconds on Windows

          NOT included yet:
          - VOD monitoring
          - yt-dlp download
          - YouTube video upload
          - Discord / queue / history / updater

          Important:
          This build is NOT code-signed. Smart App Control may still block it on PCs where Smart App Control is ON.
          '@ | Set-Content -Path '.\out\OAUTH_DIAGNOSTIC_NOTES_v1.0.26.1.txt' -Encoding UTF8

      - name: Upload native test
        uses: actions/upload-artifact@v4
        with:
          name: KURO-Auto-Archive-v1.0.26.1-OAuth-Diagnostic-TEST
          path: |
            out/KURO Auto Archive.exe
            out/OAUTH_DIAGNOSTIC_NOTES_v1.0.26.1.txt
          if-no-files-found: error
